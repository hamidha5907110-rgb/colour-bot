<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeSid | Advanced Anime Hub</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 300: '#c4b5fd', 400: '#a78bfa', 500: '#8b5cf6', 600: '#7c3aed', 700: '#6d28d9', 900: '#4c1d95' },
                        dark: { 800: '#1e293b', 900: '#0f172a', 950: '#020617' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    animation: {
                        'gradient-x': 'gradient-x 15s ease infinite',
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                        'slide-up': 'slideUp 0.5s ease-out forwards',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>

    <!-- HLS.js for raw video streaming -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #8b5cf6; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        
        .glass-nav { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .glass-panel { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(24px); border-left: 1px solid rgba(255, 255, 255, 0.1); }
        
        .anime-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .anime-card:hover { transform: translateY(-8px) scale(1.02); box-shadow: 0 20px 25px -5px rgba(139, 92, 246, 0.2); border-color: rgba(139, 92, 246, 0.4); z-index: 10; }
        .card-image { transition: transform 0.7s ease; }
        .anime-card:hover .card-image { transform: scale(1.08); }
        .image-overlay { background: linear-gradient(to top, rgba(15,23,42,1) 0%, rgba(15,23,42,0.2) 60%, transparent 100%); }

        .shimmer {
            background: #1e293b;
            background-image: linear-gradient(to right, #1e293b 0%, #334155 20%, #1e293b 40%, #1e293b 100%);
            background-repeat: no-repeat; background-size: 800px 100%; 
            animation: placeholderShimmer 1.5s linear infinite forwards;
        }
        @keyframes placeholderShimmer { 0% { background-position: -468px 0; } 100% { background-position: 468px 0; } }
        
        .toast { position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); transition: bottom 0.4s ease; z-index: 9999; }
        .toast.show { bottom: 24px; }
        .ep-btn-active { background: linear-gradient(135deg, #7c3aed, #8b5cf6) !important; color: white !important; font-weight: 700 !important; border-color: #a78bfa !important; box-shadow: 0 0 15px rgba(139, 92, 246, 0.5); }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col relative">

    <!-- Navigation -->
    <nav class="fixed w-full z-50 glass-nav transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                
                <!-- Logo -->
                <div class="flex-shrink-0 flex items-center gap-3 cursor-pointer group" onclick="window.scrollTo(0,0)">
                    <div class="p-2 bg-gradient-to-br from-brand-600 to-brand-500 rounded-xl shadow-lg">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path></svg>
                    </div>
                    <span class="font-black text-2xl tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-brand-300 to-white hidden sm:block">
                        AnimeSiddhesh
                    </span>
                </div>

                <!-- Search Bar -->
                <div class="flex-grow max-w-md mx-4 relative">
                    <input type="text" id="search-input" placeholder="Search any anime..." class="w-full bg-dark-900/50 border border-gray-700 text-white px-5 py-2 rounded-full focus:outline-none focus:border-brand-500 transition-colors text-sm shadow-inner placeholder-gray-500">
                    <button id="search-btn" class="absolute right-3 top-2 text-gray-400 hover:text-brand-500 transition-colors">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </button>
                </div>

                <!-- Watchlist Toggle & Status -->
                <div class="flex items-center gap-4">
                    <div id="auth-status" class="hidden md:flex items-center gap-2 text-xs font-semibold text-brand-400 bg-brand-900/30 px-3 py-1.5 rounded-full border border-brand-500/20">
                        <div class="w-2 h-2 bg-brand-500 rounded-full animate-pulse"></div>
                        Connecting...
                    </div>
                    <button id="toggle-watchlist-btn" class="relative p-2.5 text-gray-300 hover:text-white bg-dark-800 rounded-xl border border-gray-700 flex items-center gap-2 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path></svg>
                        <span class="hidden md:inline font-bold text-sm">Watchlist</span>
                        <span id="nav-watchlist-count" class="absolute -top-2 -right-2 bg-brand-600 text-white text-[10px] font-black w-5 h-5 flex items-center justify-center rounded-full scale-0 transition-transform">0</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <div class="relative pt-24 pb-16 flex content-center items-center justify-center min-h-[40vh] overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-br from-indigo-950 via-slate-900 to-brand-950 animate-gradient-x opacity-90"></div>
        <div class="absolute top-20 left-10 w-96 h-96 bg-brand-600 rounded-full mix-blend-screen filter blur-[100px] opacity-30 animate-pulse-slow"></div>
        <div class="absolute bottom-10 right-20 w-[500px] h-[500px] bg-blue-600 rounded-full mix-blend-screen filter blur-[120px] opacity-20 animate-pulse-slow" style="animation-delay: 2s;"></div>
        <div class="container relative mx-auto px-4 text-center z-10">
            <div class="inline-flex items-center gap-2 py-1.5 px-4 rounded-full bg-dark-900/80 border border-brand-500/40 text-brand-300 text-xs font-bold tracking-widest mb-6 shadow-[0_0_15px_rgba(139,92,246,0.2)]">
                <span class="relative flex h-2.5 w-2.5">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-brand-500"></span>
                </span>
                <span id="hero-badge-text">GLOBAL ANIME DATABASE</span>
            </div>
            <h1 class="text-white font-black text-4xl sm:text-6xl md:text-7xl leading-tight mb-4 drop-shadow-2xl">
                Stream <span class="text-transparent bg-clip-text bg-gradient-to-r from-brand-400 to-blue-400">Everything.</span>
            </h1>
        </div>
    </div>

    <!-- Anime Grid Main Area -->
    <main id="main-content" class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 relative z-10">
        <h2 id="section-title" class="text-2xl md:text-3xl font-black text-white mb-8 border-b border-gray-800 pb-2 relative inline-block">
            Trending Catalog
            <div class="absolute -bottom-0.5 left-0 w-1/2 h-1 bg-gradient-to-r from-brand-500 to-transparent rounded-full"></div>
        </h2>
        <div id="anime-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-6 lg:gap-8"></div>
    </main>

    <!-- Cinematic Player Modal -->
    <div id="player-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center opacity-0 transition-opacity duration-300">
        <div id="player-backdrop" class="absolute inset-0 bg-black/95 backdrop-blur-xl"></div>
        
        <div class="relative w-full max-w-[1500px] max-h-[95vh] h-full mx-2 sm:mx-6 bg-dark-900 border border-gray-700/50 rounded-2xl shadow-2xl flex flex-col lg:flex-row overflow-hidden transform scale-95 transition-transform duration-300" id="player-container">
            
            <button id="close-player-btn" class="absolute top-3 right-3 lg:-right-12 lg:top-0 z-30 p-2.5 bg-brand-600 hover:bg-brand-500 text-white rounded-full transition-colors shadow-lg border border-white/10 lg:block">
                <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            
            <div class="flex-grow flex flex-col lg:w-[75%] border-b lg:border-b-0 lg:border-r border-gray-800 relative bg-black">
                <!-- VIDEO CONTAINER -->
                <div class="w-full aspect-video bg-black relative shadow-2xl overflow-hidden group" id="video-wrapper">
                    <!-- Native Video (Used if raw M3U8 is found) -->
                    <video id="video-player" class="w-full h-full absolute inset-0 object-contain bg-black" controls playsinline crossorigin="anonymous"></video>
                    <!-- Fallback Iframe (Used if API fails, guarantees video plays) -->
                    <iframe id="iframe-player" class="w-full h-full absolute inset-0 bg-black hidden" allowfullscreen="true" frameborder="0" marginwidth="0" marginheight="0" scrolling="no"></iframe>
                    
                    <div id="video-overlay" class="absolute inset-0 flex items-center justify-center bg-dark-950 z-10 transition-opacity duration-300">
                        <div class="flex flex-col items-center gap-4" id="video-overlay-content"></div>
                    </div>
                </div>
                
                <div class="p-6 overflow-y-auto custom-scrollbar flex-grow bg-gradient-to-b from-dark-900 to-dark-950">
                    <h2 id="player-anime-title" class="text-3xl font-black text-white mb-2">Anime Title</h2>
                    <div class="flex flex-wrap items-center gap-3 text-sm text-gray-300 mb-6">
                        <span id="player-ep-label" class="bg-brand-600 text-white px-3 py-1.5 rounded-lg font-bold shadow-[0_0_15px_rgba(139,92,246,0.3)] border border-brand-400/50">Episode 1</span>
                        <span id="player-ep-title" class="bg-dark-800 px-3 py-1.5 rounded-lg border border-gray-700 font-medium truncate max-w-[250px]">Episode Name</span>
                        <span id="player-status-label" class="bg-dark-800 px-3 py-1.5 rounded-lg border border-gray-700 font-medium text-yellow-400 flex items-center gap-1">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg> 
                            <span id="player-score">0.0</span>
                        </span>
                    </div>
                    <h4 class="text-white font-bold mb-2">Synopsis</h4>
                    <p id="player-anime-synopsis" class="text-gray-400 text-sm leading-relaxed max-w-4xl">Synopsis...</p>
                </div>
            </div>

            <!-- Episode List Sidebar -->
            <div class="lg:w-[25%] w-full h-[40vh] lg:h-full flex flex-col bg-dark-900 shadow-[-10px_0_20px_rgba(0,0,0,0.5)] z-10">
                <div class="p-5 border-b border-gray-800 bg-dark-800 sticky top-0 z-10 flex justify-between items-center">
                    <h3 class="font-bold text-white flex items-center gap-2">
                        <svg class="w-5 h-5 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
                        Episodes
                    </h3>
                    <span id="ep-count-badge" class="text-xs font-bold bg-dark-950 text-gray-400 px-2.5 py-1 rounded-md border border-gray-700">Loading...</span>
                </div>
                <div id="episodes-container" class="flex-grow overflow-y-auto p-3 flex flex-col gap-2 custom-scrollbar bg-dark-900"></div>
            </div>
        </div>
    </div>

    <!-- Sidebar Watchlist Backdrop & Panel -->
    <div id="sidebar-backdrop" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-[60] hidden opacity-0 transition-opacity duration-300"></div>
    <aside id="watchlist-sidebar" class="fixed inset-y-0 right-0 w-full sm:w-[420px] glass-panel z-[70] transform translate-x-full shadow-2xl flex flex-col border-l border-white/10 transition-transform duration-400 ease-in-out">
        <div class="p-6 border-b border-gray-700/50 flex items-center justify-between bg-dark-800/80 backdrop-blur">
            <div class="flex items-center gap-4">
                <div class="p-2.5 bg-brand-500/20 rounded-xl border border-brand-500/30">
                    <svg class="w-6 h-6 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path></svg>
                </div>
                <div>
                    <h3 class="text-xl font-black text-white tracking-wide">Cloud Watchlist</h3>
                    <p class="text-xs text-green-400 font-medium flex items-center gap-1 mt-0.5">
                        <span class="w-1.5 h-1.5 bg-green-500 rounded-full inline-block animate-pulse"></span> Firebase Synced
                    </p>
                </div>
            </div>
            <button id="close-sidebar-btn" class="p-2.5 text-gray-400 hover:text-white hover:bg-white/10 rounded-xl transition-all">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div id="watchlist-container" class="flex-grow overflow-y-auto p-4 space-y-3 custom-scrollbar bg-dark-900/50">
            <div class="flex justify-center items-center h-full">
                <svg class="animate-spin h-8 w-8 text-brand-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            </div>
        </div>
    </aside>

    <!-- Toast Notification -->
    <div id="toast" class="toast glass-nav px-6 py-3 rounded-full border border-gray-700 flex items-center gap-3 shadow-[0_10px_40px_rgba(0,0,0,0.5)]">
        <span id="toast-message" class="text-sm font-bold text-white tracking-wide">Notification</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const Config = { 
            jikanBase: 'https://api.jikan.moe/v4',
            appId: typeof __app_id !== 'undefined' ? __app_id : 'default-animesiddhesh'
        };
        const State = { db: null, auth: null, userId: null, catalog: [], watchlist: [], currentAnime: null, activeEpisodes: [], hls: null };
        const Elements = { 
            grid: document.getElementById('anime-grid'), 
            modal: document.getElementById('player-modal'), 
            container: document.getElementById('player-container'),
            sidebar: document.getElementById('watchlist-sidebar'),
            sidebarBackdrop: document.getElementById('sidebar-backdrop'),
            watchlistContainer: document.getElementById('watchlist-container'),
            badgeCount: document.getElementById('nav-watchlist-count')
        };

        // --- UI Toast & Sidebar ---
        const showToast = (msg, type = 'success') => {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        };

        const toggleSidebar = (show) => {
            if (show) {
                Elements.sidebar.classList.remove('translate-x-full');
                Elements.sidebarBackdrop.classList.remove('hidden');
                setTimeout(() => Elements.sidebarBackdrop.classList.remove('opacity-0'), 10);
                if (Elements.modal.classList.contains('hidden')) document.body.style.overflow = 'hidden';
            } else {
                Elements.sidebar.classList.add('translate-x-full');
                Elements.sidebarBackdrop.classList.add('opacity-0');
                setTimeout(() => Elements.sidebarBackdrop.classList.add('hidden'), 300);
                if (Elements.modal.classList.contains('hidden')) document.body.style.overflow = '';
            }
        };

        document.getElementById('toggle-watchlist-btn').onclick = () => toggleSidebar(true);
        document.getElementById('close-sidebar-btn').onclick = () => toggleSidebar(false);
        Elements.sidebarBackdrop.onclick = () => toggleSidebar(false);

        // --- SEARCH LOGIC ---
        const handleSearch = async () => {
            const query = document.getElementById('search-input').value.trim();
            if (!query) {
                document.getElementById('section-title').textContent = "Trending Catalog";
                document.getElementById('hero-badge-text').textContent = "GLOBAL ANIME DATABASE";
                return API.fetchTop();
            }
            
            document.getElementById('hero-badge-text').textContent = "SEARCH RESULTS";
            document.getElementById('section-title').textContent = `Results for "${query}"`;
            
            Elements.grid.innerHTML = Array(10).fill(0).map(() => `<div class="rounded-xl overflow-hidden bg-dark-800 border border-gray-800 h-[380px] flex flex-col"><div class="h-[250px] shimmer w-full"></div><div class="p-4 flex-grow flex flex-col gap-3"><div class="h-5 shimmer w-3/4 rounded"></div><div class="h-3 shimmer w-1/2 rounded"></div></div></div>`).join('');
            
            try {
                const res = await fetch(`${Config.jikanBase}/anime?q=${encodeURIComponent(query)}&limit=24&sfw=true`);
                const json = await res.json();
                State.catalog = json.data;
                Renderer.grid();
            } catch (e) {
                showToast("Search failed. Check your connection.", "error");
            }
        };

        document.getElementById('search-btn').onclick = handleSearch;
        document.getElementById('search-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSearch(); });

        // --- DATA FETCHING ---
        const API = {
            fetchTop: async () => {
                Elements.grid.innerHTML = Array(15).fill(0).map(() => `<div class="rounded-xl overflow-hidden bg-dark-800 border border-gray-800 h-[380px] flex flex-col"><div class="h-[250px] shimmer w-full"></div><div class="p-4 flex-grow flex flex-col gap-3"><div class="h-5 shimmer w-3/4 rounded"></div><div class="h-3 shimmer w-1/2 rounded"></div></div></div>`).join('');
                try {
                    const res = await fetch(`${Config.jikanBase}/top/anime?limit=24`);
                    const json = await res.json();
                    State.catalog = json.data;
                    Renderer.grid();
                } catch (error) {
                    showToast("Failed to load anime.", "error");
                }
            },
            fetchEpisodes: async (animeId) => {
                try {
                    const res = await fetch(`${Config.jikanBase}/anime/${animeId}/episodes`);
                    const json = await res.json();
                    if (json.data && json.data.length > 0) {
                        return json.data.map(ep => ({ num: ep.mal_id, title: ep.title }));
                    }
                } catch (e) {}
                
                let eps = [];
                for(let i=1; i<=12; i++) eps.push({ num: i, title: `Episode ${i}` });
                return eps;
            }
        };

        // --- RENDER ENGINE ---
        const Renderer = {
            grid: () => {
                Elements.grid.innerHTML = ''; 
                if(State.catalog.length === 0) {
                    Elements.grid.innerHTML = '<div class="col-span-full text-center py-10 text-gray-400">No anime found matching your search.</div>';
                    return;
                }

                State.catalog.forEach((anime, i) => {
                    const isInList = State.watchlist.some(item => item.id === anime.mal_id);
                    const img = anime.images?.webp?.large_image_url || anime.images?.jpg?.image_url;
                    
                    const card = document.createElement('div');
                    card.className = "anime-card bg-dark-800 rounded-xl overflow-hidden border border-gray-700/50 flex flex-col h-full animate-fade-in opacity-0 relative group";
                    card.style.animationDelay = `${i * 30}ms`;
                    
                    card.innerHTML = `
                        <div class="relative aspect-[3/4] w-full overflow-hidden bg-dark-900">
                            <img src="${img}" alt="${anime.title}" loading="lazy" class="card-image w-full h-full object-cover">
                            <div class="image-overlay absolute inset-0 flex flex-col justify-between p-3 pointer-events-none">
                                <div class="flex justify-end">
                                    <span class="bg-black/80 backdrop-blur-md text-white text-xs font-black px-2 py-1 rounded-md border border-gray-600/50 flex items-center gap-1 shadow">
                                        <svg class="w-3.5 h-3.5 text-yellow-400" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                                        ${anime.score || 'N/A'}
                                    </span>
                                </div>
                            </div>
                            <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center z-10 cursor-pointer watch-trigger">
                                <div class="bg-brand-500 text-white p-4 rounded-full shadow-[0_0_30px_rgba(139,92,246,0.8)] backdrop-blur-sm transform scale-75 group-hover:scale-100 transition-all duration-300">
                                    <svg class="w-8 h-8 ml-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                                </div>
                            </div>
                        </div>
                        <div class="p-4 flex flex-col flex-grow bg-gradient-to-b from-dark-800 to-dark-900 border-t border-gray-700/30 z-20">
                            <h3 class="text-sm md:text-base font-bold text-white mb-1 line-clamp-2 leading-tight" title="${anime.title}">${anime.title}</h3>
                            <div class="flex items-center justify-between mt-1 mb-4 text-xs font-medium text-gray-400">
                                <span class="bg-dark-700 px-2 py-0.5 rounded text-[10px] uppercase">${anime.type || 'TV'}</span>
                                <span>${anime.episodes ? anime.episodes + ' eps' : 'Ongoing'}</span>
                            </div>
                            <div class="mt-auto flex gap-2">
                                <button class="watch-btn flex-1 bg-brand-600 hover:bg-brand-500 text-white py-2 rounded-lg font-bold text-xs transition-all shadow-lg hover:shadow-brand-500/30 flex justify-center items-center gap-1">
                                    Stream Now
                                </button>
                                <button class="add-list-btn w-10 h-10 flex-shrink-0 flex items-center justify-center rounded-lg border transition-all ${isInList ? 'bg-dark-700 border-gray-600 text-brand-400' : 'bg-dark-800 border-gray-600 text-gray-300 hover:text-white hover:border-brand-400'}" ${isInList ? 'disabled' : ''}>
                                    ${isInList ? '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>' : '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>'}
                                </button>
                            </div>
                        </div>
                    `;
                    
                    const trigger = () => Player.open(anime);
                    card.querySelector('.watch-trigger').onclick = trigger;
                    card.querySelector('.watch-btn').onclick = trigger;
                    if (!isInList) card.querySelector('.add-list-btn').onclick = (e) => { e.stopPropagation(); FirebaseOps.addToList(anime, card.querySelector('.add-list-btn')); };
                    
                    Elements.grid.appendChild(card);
                });
            },

            watchlist: () => {
                Elements.badgeCount.textContent = State.watchlist.length;
                Elements.badgeCount.classList.toggle('scale-0', State.watchlist.length === 0);
                Elements.badgeCount.classList.toggle('scale-100', State.watchlist.length > 0);

                if (State.watchlist.length === 0) {
                    Elements.watchlistContainer.innerHTML = `<div class="flex flex-col items-center justify-center h-64 text-center px-4 animate-fade-in opacity-80"><div class="w-16 h-16 bg-dark-800 rounded-full flex items-center justify-center mb-4 border border-gray-700"><svg class="w-8 h-8 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg></div><p class="text-white font-bold text-lg">Empty List</p><p class="text-sm text-gray-500 mt-2">Add anime from the catalog to build your cloud library.</p></div>`;
                    return;
                }

                Elements.watchlistContainer.innerHTML = '';
                const sorted = [...State.watchlist].sort((a, b) => b.addedAt - a.addedAt);

                sorted.forEach((item, index) => {
                    const el = document.createElement('div');
                    el.className = "flex gap-3 bg-dark-800 p-3 rounded-xl border border-gray-700/50 group hover:border-brand-500/50 hover:bg-dark-800/80 transition-all shadow-sm relative overflow-hidden";
                    
                    el.innerHTML = `
                        <div class="relative w-16 h-24 flex-shrink-0 cursor-pointer list-trigger rounded-lg overflow-hidden">
                            <img src="${item.image}" class="w-full h-full object-cover transition-transform group-hover:scale-110" alt="${item.title}">
                            <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                            </div>
                        </div>
                        <div class="flex-grow min-w-0 py-1 flex flex-col">
                            <h4 class="text-sm font-bold text-white truncate pr-6 cursor-pointer list-trigger hover:text-brand-300" title="${item.title}">${item.title}</h4>
                            <div class="flex items-center gap-2 mt-1.5">
                                <span class="text-[10px] font-semibold bg-dark-950 border border-gray-700 px-1.5 py-0.5 rounded text-gray-400 uppercase">${item.type}</span>
                                <span class="text-xs text-gray-400 font-medium">${item.episodes ? item.episodes + ' Eps' : '? Eps'}</span>
                            </div>
                            <div class="mt-auto flex justify-between items-center z-10 relative">
                                <button class="watch-list-btn text-xs font-bold text-brand-400 hover:text-brand-300 flex items-center gap-1 bg-brand-500/10 px-2 py-1 rounded transition-colors">
                                    <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg> Stream
                                </button>
                            </div>
                        </div>
                        <button class="remove-btn absolute top-2 right-2 p-1.5 text-gray-500 hover:text-red-400 bg-dark-900/80 hover:bg-red-400/20 rounded-lg transition-all opacity-0 group-hover:opacity-100" title="Remove">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    `;
                    
                    const handlePlay = () => {
                        let aData = State.catalog.find(a => a.mal_id === item.id) || { mal_id: item.id, title: item.title, type: item.type, episodes: item.episodes, score: item.score, synopsis: "Loaded from Watchlist..." };
                        Player.open(aData);
                    };

                    el.querySelectorAll('.list-trigger').forEach(b => b.onclick = handlePlay);
                    el.querySelector('.watch-list-btn').onclick = handlePlay;
                    el.querySelector('.remove-btn').onclick = (e) => { e.stopPropagation(); FirebaseOps.removeFromList(item.id, item.title); };
                    Elements.watchlistContainer.appendChild(el);
                });
            }
        };

        // --- SMART VIDEO PLAYER WITH FALLBACK ---
        const Player = {
            open: async (anime) => {
                State.currentAnime = anime;
                document.getElementById('player-anime-title').textContent = anime.title;
                document.getElementById('player-score').textContent = anime.score || 'N/A';
                document.getElementById('player-status-label').innerHTML = `${anime.type || 'TV'} &bull; ${anime.episodes ? anime.episodes + ' Eps' : 'Ongoing'}`;
                document.getElementById('player-anime-synopsis').textContent = anime.synopsis ? anime.synopsis.replace('[Written by MAL Rewrite]', '').trim() : "Synopsis unavailable.";
                
                Elements.modal.classList.remove('hidden');
                setTimeout(() => { Elements.modal.classList.remove('opacity-0'); Elements.container.classList.remove('scale-95'); }, 10);
                document.body.style.overflow = 'hidden';
                toggleSidebar(false);

                const epContainer = document.getElementById('episodes-container');
                epContainer.innerHTML = '<div class="text-center text-gray-500 py-4 w-full flex justify-center"><div class="w-6 h-6 border-2 border-brand-500 border-t-transparent rounded-full animate-spin"></div></div>';
                
                State.activeEpisodes = await API.fetchEpisodes(anime.mal_id);
                document.getElementById('ep-count-badge').textContent = `${State.activeEpisodes.length} Eps`;
                
                epContainer.innerHTML = '';
                State.activeEpisodes.forEach(ep => {
                    const btn = document.createElement('button');
                    btn.className = `ep-btn w-full text-left p-3 rounded-lg border border-gray-700 bg-dark-800 text-gray-300 hover:bg-dark-700 hover:text-white transition-all flex flex-col group`;
                    btn.innerHTML = `<span class="text-xs font-bold text-brand-400 group-hover:text-brand-300">Episode ${ep.num}</span><span class="text-sm font-medium truncate w-full">${ep.title}</span>`;
                    btn.onclick = () => Player.playEpisode(ep);
                    epContainer.appendChild(btn);
                });

                if (State.activeEpisodes.length > 0) Player.playEpisode(State.activeEpisodes[0]);
            },

            playEpisode: async (ep) => {
                const video = document.getElementById('video-player');
                const iframe = document.getElementById('iframe-player');
                const overlay = document.getElementById('video-overlay');
                
                document.getElementById('player-ep-label').textContent = `Episode ${ep.num}`;
                document.getElementById('player-ep-title').textContent = ep.title;
                
                document.querySelectorAll('.ep-btn').forEach((btn, idx) => {
                    btn.classList.toggle('ep-btn-active', idx === (ep.num - 1));
                    if (idx === (ep.num - 1)) btn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                });

                overlay.classList.remove('hidden', 'opacity-0');
                overlay.innerHTML = `<div class="w-12 h-12 border-4 border-brand-500 border-t-transparent rounded-full animate-spin mb-3"></div><p class="text-brand-400 font-bold text-sm tracking-widest animate-pulse">CONNECTING SECURE STREAM...</p>`;
                
                if (State.hls) { State.hls.destroy(); State.hls = null; }
                video.pause(); video.removeAttribute('src'); video.load();
                
                try {
                    // Attempt 1: Fetch raw M3U8 from Open Consumet API
                    const searchRes = await fetch(`https://api-consumet.vercel.app/anime/gogoanime/${encodeURIComponent(State.currentAnime.title)}`);
                    const searchData = await searchRes.json();
                    
                    if (searchData.results && searchData.results.length > 0) {
                        const animeId = searchData.results[0].id;
                        const streamRes = await fetch(`https://api-consumet.vercel.app/anime/gogoanime/watch/${animeId}-episode-${ep.num}`);
                        const streamData = await streamRes.json();
                        
                        const bestUrl = (streamData.sources.find(s => s.quality === '1080p' || s.quality === 'default') || streamData.sources[0]).url;
                        
                        iframe.classList.add('hidden');
                        iframe.src = '';
                        video.classList.remove('hidden');
                        
                        if (Hls.isSupported()) {
                            State.hls = new Hls();
                            State.hls.loadSource(bestUrl);
                            State.hls.attachMedia(video);
                            State.hls.on(Hls.Events.MANIFEST_PARSED, () => { video.play(); overlay.classList.add('hidden'); });
                        } else {
                            video.src = bestUrl; video.play(); overlay.classList.add('hidden');
                        }
                        return; // Exit if successful
                    }
                } catch (err) {
                    console.warn("Direct stream failed. Booting Smart Fallback Player...");
                }

                // Attempt 2: Smart Fallback (Guarantees Video)
                video.classList.add('hidden');
                iframe.classList.remove('hidden');
                
                // Embeds powerful external streaming player using MyAnimeList ID
                iframe.src = `https://vidsrc.to/embed/anime/${State.currentAnime.mal_id}/${ep.num}`;
                
                setTimeout(() => {
                    overlay.classList.add('opacity-0');
                    setTimeout(() => overlay.classList.add('hidden'), 300);
                }, 1500);
            },

            close: () => {
                Elements.modal.classList.add('opacity-0');
                Elements.container.classList.add('scale-95');
                setTimeout(() => {
                    Elements.modal.classList.add('hidden');
                    if (State.hls) { State.hls.destroy(); State.hls = null; }
                    document.getElementById('video-player').pause();
                    document.getElementById('iframe-player').src = '';
                    if (Elements.sidebar.classList.contains('translate-x-full')) document.body.style.overflow = '';
                }, 300);
            }
        };

        document.getElementById('close-player-btn').onclick = Player.close;
        document.getElementById('player-backdrop').onclick = Player.close;

        // --- FIREBASE CLOUD SYNC ---
        const FirebaseOps = {
            init: async () => {
                const authUI = document.getElementById('auth-status');
                try {
                    if (typeof __firebase_config === 'undefined') throw new Error("Firebase config absent. Running in Local Mode.");
                    
                    const app = initializeApp(JSON.parse(__firebase_config));
                    State.db = getFirestore(app);
                    State.auth = getAuth(app);
                    
                    authUI.classList.remove('hidden');

                    const initialToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                    if (initialToken) await signInWithCustomToken(State.auth, initialToken);
                    else await signInAnonymously(State.auth);
                    
                    State.userId = State.auth.currentUser.uid;
                    
                    authUI.innerHTML = `<div class="w-2.5 h-2.5 bg-green-500 rounded-full shadow-[0_0_8px_rgba(34,197,94,0.8)] border border-white/20"></div><span class="text-green-400">Cloud Synced</span>`;
                    authUI.classList.replace('bg-brand-900/30', 'bg-green-900/20');
                    authUI.classList.replace('border-brand-500/20', 'border-green-500/30');

                    FirebaseOps.setupListener();
                } catch (err) {
                    authUI.innerHTML = `<div class="w-2.5 h-2.5 bg-yellow-500 rounded-full shadow-[0_0_8px_rgba(234,179,8,0.8)] border border-white/20"></div><span class="text-yellow-400">Local Mode</span>`;
                    authUI.classList.replace('bg-brand-900/30', 'bg-yellow-900/20');
                    authUI.classList.replace('border-brand-500/20', 'border-yellow-500/30');
                    authUI.classList.remove('hidden');
                }
            },
            
            setupListener: () => {
                if (!State.userId) return;
                const colRef = collection(State.db, 'artifacts', Config.appId, 'users', State.userId, 'watchlist');
                onSnapshot(colRef, (snapshot) => {
                    State.watchlist = [];
                    snapshot.forEach((doc) => State.watchlist.push(doc.data()));
                    Renderer.watchlist();
                    if (State.catalog.length > 0) Renderer.grid();
                });
            },

            addToList: async (anime, btnElement) => {
                if (!State.userId) { showToast("Authentication required for Cloud Sync.", "error"); return; }
                if (btnElement) {
                    btnElement.innerHTML = `<svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;
                    btnElement.disabled = true;
                }

                const docData = {
                    id: anime.mal_id, title: anime.title,
                    image: anime.images?.webp?.large_image_url || anime.images?.jpg?.image_url,
                    score: anime.score || 'N/A', episodes: anime.episodes || null, type: anime.type || 'Unknown',
                    addedAt: Date.now()
                };

                try {
                    await setDoc(doc(State.db, 'artifacts', Config.appId, 'users', State.userId, 'watchlist', docData.id.toString()), docData);
                    showToast(`Saved ${docData.title} to Watchlist`);
                } catch (e) {
                    showToast("Cloud save failed.", "error");
                    if (btnElement) {
                        btnElement.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>`;
                        btnElement.disabled = false;
                    }
                }
            },
            
            removeFromList: async (id, title) => {
                if (!State.userId) return;
                try {
                    await deleteDoc(doc(State.db, 'artifacts', Config.appId, 'users', State.userId, 'watchlist', id.toString()));
                    showToast(`Removed ${title}`);
                } catch (e) { showToast("Failed to remove.", "error"); }
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            FirebaseOps.init();
            API.fetchTop();
        });
    </script>
</body>
</html>
