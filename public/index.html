<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeSiddhesh | Ultimate Fast Anime Hub</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 300: '#c4b5fd', 400: '#a78bfa', 500: '#8b5cf6', 600: '#7c3aed', 700: '#6d28d9', 900: '#4c1d95' },
                        dark: { 800: '#1e293b', 900: '#0f172a', 950: '#020617' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    animation: {
                        'gradient-x': 'gradient-x 15s ease infinite',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'pop-in': 'popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
                        'slide-in': 'slideIn 0.3s ease-out forwards'
                    },
                    keyframes: {
                        'gradient-x': {
                            '0%, 100%': { 'background-size': '200% 200%', 'background-position': 'left center' },
                            '50%': { 'background-size': '200% 200%', 'background-position': 'right center' }
                        },
                        popIn: {
                            '0%': { transform: 'scale(0.9) translateY(20px)', opacity: '0' },
                            '100%': { transform: 'scale(1) translateY(0)', opacity: '1' }
                        },
                        slideIn: {
                            '0%': { transform: 'translateX(100%)' },
                            '100%': { transform: 'translateX(0)' }
                        }
                    }
                }
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #8b5cf6; }
        
        .glass-nav { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .glass-panel { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(24px); border-left: 1px solid rgba(255, 255, 255, 0.1); }

        .anime-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .anime-card:hover { transform: translateY(-10px) scale(1.03); box-shadow: 0 25px 30px -5px rgba(139, 92, 246, 0.3); border-color: rgba(139, 92, 246, 0.5); z-index: 10; }
        .card-image { transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1); }
        .anime-card:hover .card-image { transform: scale(1.1); }
        .image-overlay { background: linear-gradient(to top, rgba(15,23,42,1) 0%, rgba(15,23,42,0.1) 70%, transparent 100%); }

        .shimmer {
            background: #1e293b; background-image: linear-gradient(to right, #1e293b 0%, #334155 20%, #1e293b 40%, #1e293b 100%);
            background-repeat: no-repeat; background-size: 800px 100%; animation: placeholderShimmer 1.2s linear infinite forwards;
        }
        @keyframes placeholderShimmer { 0% { background-position: -468px 0; } 100% { background-position: 468px 0; } }
        
        .toast { position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); transition: bottom 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 9999; }
        .toast.show { bottom: 24px; }
        .ep-btn-active { background: linear-gradient(135deg, #7c3aed, #8b5cf6) !important; color: white !important; border-color: #a78bfa !important; box-shadow: 0 0 15px rgba(139, 92, 246, 0.5); font-weight: 800 !important; transform: scale(1.02); }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col relative">

    <!-- FAST NAVIGATION -->
    <nav class="fixed w-full z-50 glass-nav transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                
                <!-- Logo -->
                <div class="flex-shrink-0 flex items-center gap-3 cursor-pointer group" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
                    <div class="p-2 bg-gradient-to-br from-brand-600 to-brand-500 rounded-xl shadow-lg shadow-brand-500/30 group-hover:rotate-12 transition-all duration-300">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path></svg>
                    </div>
                    <span class="font-black text-2xl tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-brand-300 to-white hidden sm:block">AnimeSiddhesh</span>
                </div>

                <!-- LIVE SEARCH BAR -->
                <div class="flex-grow max-w-xl mx-4 relative hidden sm:block group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="w-4 h-4 text-gray-400 group-focus-within:text-brand-500 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    <input type="text" id="search-input" placeholder="Live search any anime..." class="w-full bg-dark-900/50 border border-gray-700 text-white pl-10 pr-5 py-2.5 rounded-full focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition-all text-sm shadow-inner placeholder-gray-500">
                </div>

                <!-- Nav Controls -->
                <div class="flex items-center gap-4">
                    <div id="auth-status" class="hidden md:flex items-center gap-2 text-xs font-bold text-green-400 bg-green-900/20 px-3 py-1.5 rounded-full border border-green-500/30">
                        <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div> API Ready
                    </div>
                    <button id="toggle-watchlist-btn" class="relative group p-2.5 text-gray-300 hover:text-white bg-dark-800 hover:bg-dark-700 rounded-xl border border-gray-700 hover:border-brand-500/50 transition-all shadow-lg flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path></svg>
                        <span class="hidden md:inline font-bold text-sm">Watchlist</span>
                        <span id="nav-watchlist-count" class="absolute -top-2 -right-2 bg-brand-600 text-white text-[10px] font-black w-5 h-5 flex items-center justify-center rounded-full border-2 border-dark-900 shadow-sm scale-0 transition-transform duration-300">0</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- HERO SECTION -->
    <div class="relative pt-24 pb-16 flex content-center items-center justify-center min-h-[40vh] overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-br from-indigo-950 via-slate-900 to-brand-950 animate-gradient-x opacity-90"></div>
        <div class="absolute top-20 left-10 w-96 h-96 bg-brand-600 rounded-full mix-blend-screen filter blur-[100px] opacity-30 animate-pulse-slow"></div>
        <div class="absolute bottom-10 right-20 w-[500px] h-[500px] bg-blue-600 rounded-full mix-blend-screen filter blur-[120px] opacity-20 animate-pulse-slow" style="animation-delay: 2s;"></div>
        
        <div class="container relative mx-auto px-4 text-center z-10">
            <div class="inline-flex items-center gap-2 py-1.5 px-4 rounded-full bg-dark-900/80 backdrop-blur-md border border-brand-500/40 text-brand-300 text-xs font-bold tracking-widest mb-6 shadow-[0_0_20px_rgba(139,92,246,0.3)]">
                <span class="relative flex h-2.5 w-2.5">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-brand-500"></span>
                </span>
                <span id="hero-badge-text">ULTRA FAST STREAMING</span>
            </div>
            <h1 class="text-white font-black text-5xl sm:text-6xl md:text-8xl leading-tight mb-4 drop-shadow-2xl tracking-tight">
                Stream <span class="text-transparent bg-clip-text bg-gradient-to-r from-brand-400 to-blue-400">Everything.</span>
            </h1>
        </div>
    </div>

    <!-- ANIME GRID -->
    <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-10 relative z-10">
        <h2 id="section-title" class="text-3xl md:text-4xl font-black text-white mb-8 border-b border-gray-800 pb-3 relative inline-block">
            Trending Catalog
            <div class="absolute -bottom-0.5 left-0 w-2/3 h-1 bg-gradient-to-r from-brand-500 to-transparent rounded-full"></div>
        </h2>
        <div id="anime-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-6 lg:gap-8">
            <!-- Populated via JS -->
        </div>
    </main>

    <!-- CINEMATIC PLAYER MODAL -->
    <div id="player-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center opacity-0 transition-all duration-400">
        <div id="player-backdrop" class="absolute inset-0 bg-black/95 backdrop-blur-xl"></div>
        
        <div class="relative w-full max-w-[1600px] max-h-[95vh] h-full mx-2 sm:mx-6 bg-dark-900 border border-gray-700/50 rounded-2xl shadow-2xl flex flex-col lg:flex-row overflow-hidden transform scale-95 transition-transform duration-400" id="player-container">
            
            <button id="close-player-btn" class="absolute top-3 right-3 lg:-right-14 lg:top-0 z-30 p-3 bg-brand-600 hover:bg-red-500 text-white rounded-full transition-colors shadow-[0_0_15px_rgba(0,0,0,0.5)] lg:block">
                <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            
            <div class="flex-grow flex flex-col lg:w-[75%] border-b lg:border-b-0 lg:border-r border-gray-800 relative bg-black">
                <!-- Video Container -->
                <div class="w-full aspect-video bg-black relative shadow-2xl overflow-hidden group rounded-tl-2xl">
                    <video id="video-player" class="w-full h-full absolute inset-0 object-contain bg-black hidden" controls playsinline></video>
                    
                    <!-- THE FIX: Fallback Iframe -->
                    <iframe id="iframe-player" class="w-full h-full absolute inset-0 bg-black hidden" allowfullscreen="true" frameborder="0" scrolling="no"></iframe>
                    
                    <!-- Loading Overlay -->
                    <div id="video-overlay" class="absolute inset-0 flex items-center justify-center bg-dark-950 z-10 transition-opacity duration-300">
                        <div class="flex flex-col items-center gap-4" id="video-overlay-content"></div>
                    </div>
                </div>

                <!-- THE FIX: MULTI-SERVER SWITCHER -->
                <div id="server-switcher" class="hidden flex items-center gap-2 p-3 bg-dark-950 border-b border-gray-800 overflow-x-auto custom-scrollbar">
                    <span class="text-xs text-brand-400 font-black uppercase tracking-widest px-2 whitespace-nowrap">Servers:</span>
                    <div id="server-buttons" class="flex gap-2"></div>
                </div>
                
                <!-- Anime Details Panel -->
                <div class="p-6 overflow-y-auto custom-scrollbar flex-grow bg-gradient-to-b from-dark-900 to-dark-950">
                    <h2 id="player-anime-title" class="text-3xl sm:text-4xl font-black text-white mb-3">Title</h2>
                    
                    <div class="flex flex-wrap items-center gap-3 text-sm text-gray-300 mb-6">
                        <span id="player-ep-label" class="bg-brand-600 text-white px-4 py-1.5 rounded-lg font-black shadow-[0_0_15px_rgba(139,92,246,0.3)] tracking-wide">Ep 1</span>
                        <span id="player-ep-title" class="bg-dark-800 px-4 py-1.5 rounded-lg border border-gray-700 font-bold truncate max-w-[250px] shadow-inner">Name</span>
                        <span id="player-status-label" class="bg-dark-800 px-3 py-1.5 rounded-lg border border-gray-700 font-bold text-yellow-400 flex items-center gap-1">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg> 
                            <span id="player-score">0.0</span>
                        </span>
                    </div>
                    
                    <h4 class="text-white font-bold mb-2">Synopsis</h4>
                    <p id="player-anime-synopsis" class="text-gray-400 text-sm leading-relaxed max-w-4xl opacity-90">Synopsis...</p>
                </div>
            </div>

            <!-- Episodes List Sidebar -->
            <div class="lg:w-[25%] w-full h-[40vh] lg:h-full flex flex-col bg-dark-900 shadow-[-10px_0_20px_rgba(0,0,0,0.5)] z-10 rounded-tr-2xl rounded-br-2xl">
                <div class="p-5 border-b border-gray-800 bg-dark-800 sticky top-0 z-10 flex justify-between items-center rounded-tr-2xl">
                    <h3 class="font-black text-white flex items-center gap-2 text-lg">
                        <svg class="w-5 h-5 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
                        Episodes
                    </h3>
                    <span id="ep-count-badge" class="text-xs font-bold bg-dark-950 text-gray-400 px-3 py-1 rounded-md border border-gray-700 shadow-inner">0 Eps</span>
                </div>
                <div id="episodes-container" class="flex-grow overflow-y-auto p-3 flex flex-col gap-2 custom-scrollbar bg-dark-900">
                    <!-- Populated via JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Watchlist Sidebar -->
    <div id="sidebar-backdrop" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-[60] hidden opacity-0 transition-opacity duration-300"></div>
    <aside id="watchlist-sidebar" class="fixed inset-y-0 right-0 w-full sm:w-[420px] glass-panel z-[70] transform translate-x-full shadow-2xl flex flex-col border-l border-white/10 transition-transform duration-400 ease-in-out">
        <div class="p-6 border-b border-gray-700/50 flex items-center justify-between bg-dark-800/80 backdrop-blur">
            <div class="flex items-center gap-4">
                <div class="p-2.5 bg-brand-500/20 rounded-xl border border-brand-500/30">
                    <svg class="w-6 h-6 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path></svg>
                </div>
                <div>
                    <h3 class="text-xl font-black text-white tracking-wide">Cloud Watchlist</h3>
                    <p class="text-xs text-green-400 font-medium flex items-center gap-1 mt-0.5">
                        <span class="w-1.5 h-1.5 bg-green-500 rounded-full inline-block animate-pulse"></span> Firebase Synced
                    </p>
                </div>
            </div>
            <button id="close-sidebar-btn" class="p-2.5 text-gray-400 hover:text-white hover:bg-white/10 rounded-xl transition-all">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div id="watchlist-container" class="flex-grow overflow-y-auto p-4 space-y-3 custom-scrollbar bg-dark-900/50"></div>
    </aside>

    <!-- Toast -->
    <div id="toast" class="toast glass-nav px-6 py-3 rounded-full border border-gray-700 flex items-center gap-3 shadow-[0_10px_40px_rgba(0,0,0,0.5)]">
        <div id="toast-icon"></div>
        <span id="toast-message" class="text-sm font-bold text-white tracking-wide">Notification</span>
    </div>

    <!-- SYSTEM LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==========================================
        // 1. STATE & CONFIG
        // ==========================================
        const Config = {
            appId: typeof __app_id !== 'undefined' ? __app_id : 'default-animesiddhesh',
            jikanBase: 'https://api.jikan.moe/v4',
            proxyBase: 'https://anime-api-production-040b.up.railway.app'
        };

        const State = {
            db: null, auth: null, userId: null,
            catalog: [], watchlist: [], activeEpisodes: [],
            currentAnime: null, currentEp: 1, currentServerIdx: 0,
            hls: null, searchTimeout: null
        };

        const Elements = {
            grid: document.getElementById('anime-grid'),
            modal: document.getElementById('player-modal'),
            container: document.getElementById('player-container'),
            video: document.getElementById('video-player'),
            iframe: document.getElementById('iframe-player'),
            overlay: document.getElementById('video-overlay'),
            eps: document.getElementById('episodes-container'),
            servers: document.getElementById('server-switcher'),
            serverBtns: document.getElementById('server-buttons'),
            watchlist: document.getElementById('watchlist-container')
        };

        // MULTI-SERVER CONFIGURATION (The Fix for Video Blocking)
        const VideoServers = [
            { name: 'Server 1 (Pro)', url: (id, ep) => `https://vidsrc.pro/embed/anime/${id}/${ep}` },
            { name: 'Server 2 (CC)', url: (id, ep) => `https://vidsrc.cc/v2/embed/anime/${id}/${ep}` },
            { name: 'Server 3 (To)', url: (id, ep) => `https://vidsrc.to/embed/anime/${id}/${ep}` },
            { name: 'Server 4 (Net)', url: (id, ep) => `https://vidsrc.net/embed/anime/${id}/${ep}` }
        ];

        // ==========================================
        // 2. UI UTILITIES
        // ==========================================
        const UI = {
            toast: (msg, isError = false) => {
                const t = document.getElementById('toast');
                document.getElementById('toast-message').textContent = msg;
                document.getElementById('toast-icon').innerHTML = isError 
                    ? '<svg class="w-5 h-5 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>'
                    : '<svg class="w-5 h-5 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>';
                t.classList.add('show');
                setTimeout(() => t.classList.remove('show'), 3000);
            },
            toggleSidebar: (show) => {
                const sb = document.getElementById('watchlist-sidebar'), bd = document.getElementById('sidebar-backdrop');
                if (show) { sb.classList.remove('translate-x-full'); bd.classList.remove('hidden'); setTimeout(()=>bd.classList.remove('opacity-0'),10); }
                else { sb.classList.add('translate-x-full'); bd.classList.add('opacity-0'); setTimeout(()=>bd.classList.add('hidden'),300); }
            },
            skeletons: () => {
                Elements.grid.innerHTML = Array(15).fill(0).map(() => `<div class="rounded-xl bg-dark-800 border border-gray-800 h-[380px] flex flex-col"><div class="h-[250px] shimmer w-full"></div><div class="p-4 flex-grow flex flex-col gap-3"><div class="h-5 shimmer w-3/4 rounded"></div><div class="h-3 shimmer w-1/2 rounded"></div></div></div>`).join('');
            }
        };

        document.getElementById('toggle-watchlist-btn').onclick = () => UI.toggleSidebar(true);
        document.getElementById('close-sidebar-btn').onclick = () => UI.toggleSidebar(false);
        document.getElementById('sidebar-backdrop').onclick = () => UI.toggleSidebar(false);

        // ==========================================
        // 3. LIVE SEARCH (Extra Fast)
        // ==========================================
        document.getElementById('search-input').addEventListener('input', (e) => {
            clearTimeout(State.searchTimeout);
            const query = e.target.value.trim();
            
            if (!query) {
                document.getElementById('hero-badge-text').textContent = "ULTRA FAST STREAMING";
                document.getElementById('section-title').innerHTML = `Trending Catalog <div class="absolute -bottom-0.5 left-0 w-2/3 h-1 bg-gradient-to-r from-brand-500 to-transparent rounded-full"></div>`;
                return API.fetchCatalog();
            }

            State.searchTimeout = setTimeout(async () => {
                document.getElementById('hero-badge-text').textContent = "SEARCH RESULTS";
                document.getElementById('section-title').innerHTML = `Results for "${query}" <div class="absolute -bottom-0.5 left-0 w-2/3 h-1 bg-gradient-to-r from-brand-500 to-transparent rounded-full"></div>`;
                UI.skeletons();
                
                try {
                    const res = await fetch(`${Config.jikanBase}/anime?q=${encodeURIComponent(query)}&limit=24&sfw=true`);
                    const json = await res.json();
                    State.catalog = json.data;
                    Renderer.grid();
                } catch(e) { UI.toast("Search error", true); }
            }, 600); // 600ms debounce
        });

        // ==========================================
        // 4. DATA & RENDER ENGINE
        // ==========================================
        const API = {
            fetchCatalog: async () => {
                UI.skeletons();
                try {
                    const res = await fetch(`${Config.jikanBase}/top/anime?limit=24`);
                    State.catalog = (await res.json()).data;
                    Renderer.grid();
                } catch (e) { UI.toast("Failed to load catalog", true); }
            },
            fetchEpisodes: async (id, total) => {
                if(State.episodeCache[id]) return State.episodeCache[id];
                let eps = [];
                try {
                    const res = await fetch(`${Config.jikanBase}/anime/${id}/episodes`);
                    const json = await res.json();
                    if(json.data?.length) eps = json.data.map(e => ({ num: e.mal_id, title: e.title || `Episode ${e.mal_id}` }));
                } catch(e){}
                if(!eps.length) {
                    const count = total > 0 ? total : 12;
                    for(let i=1; i<=count; i++) eps.push({ num: i, title: `Episode ${i}` });
                }
                State.episodeCache[id] = eps; return eps;
            }
        };

        const Renderer = {
            grid: () => {
                Elements.grid.innerHTML = State.catalog.length === 0 ? '<div class="col-span-full text-center py-10 text-gray-400">No results found.</div>' : ''; 
                State.catalog.forEach((anime, idx) => {
                    const isInList = State.watchlist.some(item => item.id === anime.mal_id);
                    const img = anime.images?.webp?.large_image_url || anime.images?.jpg?.image_url;
                    
                    const card = document.createElement('div');
                    card.className = "anime-card bg-dark-800 rounded-2xl overflow-hidden border border-gray-700/50 flex flex-col h-full animate-pop-in opacity-0 cursor-pointer group shadow-lg";
                    card.style.animationDelay = `${idx * 40}ms`;
                    
                    card.innerHTML = `
                        <div class="relative aspect-[3/4] w-full overflow-hidden bg-dark-900">
                            <img src="${img}" alt="${anime.title}" loading="lazy" class="card-image w-full h-full object-cover">
                            <div class="image-overlay absolute inset-0 flex flex-col justify-between p-3">
                                <div class="flex justify-end">
                                    <span class="bg-black/80 backdrop-blur-md text-white text-xs font-black px-2 py-1 rounded-md border border-gray-600/50 flex items-center gap-1 shadow">
                                        ⭐ ${anime.score || 'N/A'}
                                    </span>
                                </div>
                            </div>
                            <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center z-10">
                                <div class="bg-brand-500 text-white p-4 rounded-full shadow-[0_0_30px_rgba(139,92,246,0.9)] transform scale-50 group-hover:scale-100 transition-all duration-300">
                                    <svg class="w-8 h-8 ml-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                                </div>
                            </div>
                        </div>
                        <div class="p-4 flex flex-col flex-grow bg-gradient-to-b from-dark-800 to-dark-900 border-t border-gray-700/30 z-20">
                            <h3 class="text-sm font-black text-white mb-1 line-clamp-2 leading-tight group-hover:text-brand-400 transition-colors">${anime.title}</h3>
                            <div class="flex items-center justify-between mt-1 mb-4 text-xs font-bold text-gray-500">
                                <span class="bg-dark-700 px-2 py-0.5 rounded uppercase">${anime.type || 'TV'}</span>
                                <span>${anime.episodes ? anime.episodes + ' eps' : 'Ongoing'}</span>
                            </div>
                            <div class="mt-auto flex gap-2">
                                <button class="flex-1 bg-brand-600 hover:bg-brand-500 text-white py-2 rounded-xl font-black text-xs transition-all shadow-lg hover:shadow-brand-500/30 flex justify-center items-center gap-1">Stream</button>
                                <button class="add-list-btn w-10 h-10 flex-shrink-0 flex items-center justify-center rounded-xl border transition-all ${isInList ? 'bg-dark-700 border-gray-600 text-brand-400' : 'bg-dark-800 border-gray-600 text-gray-300 hover:text-white hover:border-brand-400 hover:bg-brand-500/10'}" ${isInList ? 'disabled' : ''}>
                                    ${isInList ? '✓' : '+'}
                                </button>
                            </div>
                        </div>
                    `;
                    card.onclick = (e) => { if(!e.target.closest('.add-list-btn')) Player.open(anime); };
                    if(!isInList) card.querySelector('.add-list-btn').onclick = (e) => { e.stopPropagation(); FirebaseOps.addToList(anime); };
                    Elements.grid.appendChild(card);
                });
            },
            watchlist: () => {
                document.getElementById('nav-watchlist-count').textContent = State.watchlist.length;
                document.getElementById('nav-watchlist-count').classList.toggle('scale-0', State.watchlist.length === 0);
                if (State.watchlist.length === 0) return Elements.watchlist.innerHTML = '<div class="text-center py-10 text-gray-500 font-bold">List is empty.</div>';
                
                Elements.watchlist.innerHTML = '';
                [...State.watchlist].sort((a, b) => b.addedAt - a.addedAt).forEach((item, i) => {
                    const el = document.createElement('div');
                    el.className = "flex gap-3 bg-dark-800 p-3 rounded-xl border border-gray-700/50 animate-slide-in opacity-0 group cursor-pointer hover:bg-dark-700 transition-all";
                    el.style.animationDelay = `${i*40}ms`;
                    el.innerHTML = `
                        <img src="${item.image}" class="w-14 h-20 object-cover rounded-lg">
                        <div class="flex-grow py-1">
                            <h4 class="text-sm font-bold text-white line-clamp-1 group-hover:text-brand-400">${item.title}</h4>
                            <span class="text-xs text-gray-400 block mt-1">${item.episodes ? item.episodes + ' Eps' : '? Eps'}</span>
                        </div>
                        <button class="remove-btn p-2 text-gray-500 hover:text-red-400"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                    `;
                    el.onclick = (e) => { if(!e.target.closest('.remove-btn')) Player.open(item); };
                    el.querySelector('.remove-btn').onclick = (e) => { e.stopPropagation(); FirebaseOps.removeFromList(item.id, item.title); };
                    Elements.watchlist.appendChild(el);
                });
            }
        };

        // ==========================================
        // 5. SMART PLAYER (WITH SERVER SWITCHER)
        // ==========================================
        const Player = {
            open: async (anime) => {
                State.currentAnime = anime; State.currentServerIdx = 0;
                document.getElementById('player-anime-title').textContent = anime.title || anime.name;
                document.getElementById('player-score').textContent = anime.score || 'N/A';
                document.getElementById('player-anime-synopsis').textContent = anime.synopsis || "Synopsis unavailable.";
                
                Elements.video.pause(); Elements.iframe.src = ''; Elements.eps.innerHTML = '';
                Elements.modal.classList.remove('hidden');
                setTimeout(() => { Elements.modal.classList.remove('opacity-0'); Elements.container.classList.remove('scale-95'); }, 10);
                
                State.activeEpisodes = await API.fetchEpisodes(anime.mal_id || anime.id, anime.episodes);
                document.getElementById('ep-count-badge').textContent = `${State.activeEpisodes.length} Eps`;
                
                State.activeEpisodes.forEach(ep => {
                    const btn = document.createElement('button');
                    btn.className = `ep-btn w-full text-left p-3 rounded-xl border border-gray-700 bg-dark-800 text-gray-300 hover:bg-dark-700 hover:text-white transition-all`;
                    btn.innerHTML = `<span class="text-xs font-black text-brand-400">Episode ${ep.num}</span><div class="text-sm font-medium truncate">${ep.title}</div>`;
                    btn.onclick = () => Player.playEpisode(ep);
                    Elements.eps.appendChild(btn);
                });

                if(State.activeEpisodes.length > 0) Player.playEpisode(State.activeEpisodes[0]);
            },

            renderServers: () => {
                Elements.servers.classList.remove('hidden');
                Elements.serverBtns.innerHTML = '';
                VideoServers.forEach((srv, idx) => {
                    const btn = document.createElement('button');
                    btn.className = `px-4 py-1.5 rounded-lg text-xs font-black transition-all shadow-md whitespace-nowrap ${idx === State.currentServerIdx ? 'bg-brand-600 text-white shadow-brand-500/40 transform scale-105' : 'bg-dark-800 text-gray-400 hover:bg-dark-700 hover:text-white border border-gray-700'}`;
                    btn.textContent = srv.name;
                    btn.onclick = () => {
                        State.currentServerIdx = idx;
                        Player.renderServers(); // Re-render to update active button
                        Elements.iframe.src = srv.url(State.currentAnime.mal_id || State.currentAnime.id, State.currentEp.num);
                    };
                    Elements.serverBtns.appendChild(btn);
                });
            },

            playEpisode: async (ep) => {
                State.currentEp = ep;
                document.getElementById('player-ep-label').textContent = `Ep ${ep.num}`;
                document.getElementById('player-ep-title').textContent = ep.title;
                
                document.querySelectorAll('.ep-btn').forEach((btn, idx) => {
                    btn.classList.toggle('ep-btn-active', idx === (ep.num - 1));
                    if (idx === (ep.num - 1)) btn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                });

                Elements.overlay.classList.remove('hidden', 'opacity-0');
                Elements.overlay.innerHTML = `<div class="w-12 h-12 border-4 border-brand-500 border-t-transparent rounded-full animate-spin mb-4 shadow-[0_0_15px_rgba(139,92,246,0.5)]"></div><p class="text-brand-400 font-black text-xs tracking-widest animate-pulse">CONNECTING TO SECURE HOST...</p>`;
                
                if (State.hls) { State.hls.destroy(); State.hls = null; }
                Elements.video.pause(); Elements.video.classList.add('hidden');
                
                // Fetch direct stream with a 3-second timeout so user doesn't wait forever
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 3000);
                    
                    const searchRes = await fetch(`https://api-consumet.vercel.app/anime/gogoanime/${encodeURIComponent(State.currentAnime.title)}`, { signal: controller.signal });
                    const searchData = await searchRes.json();
                    
                    if (searchData.results && searchData.results.length > 0) {
                        const streamRes = await fetch(`https://api-consumet.vercel.app/anime/gogoanime/watch/${searchData.results[0].id}-episode-${ep.num}`, { signal: controller.signal });
                        const streamData = await streamRes.json();
                        clearTimeout(timeoutId);
                        
                        const bestUrl = (streamData.sources.find(s => s.quality === '1080p' || s.quality === 'default') || streamData.sources[0]).url;
                        const proxiedUrl = `${Config.proxyBase}/proxy?url=${encodeURIComponent(bestUrl)}`;
                        
                        Elements.iframe.classList.add('hidden'); Elements.servers.classList.add('hidden');
                        Elements.video.classList.remove('hidden');
                        
                        if (typeof Hls !== 'undefined' && Hls.isSupported()) {
                            State.hls = new Hls(); State.hls.loadSource(proxiedUrl); State.hls.attachMedia(Elements.video);
                            State.hls.on(Hls.Events.MANIFEST_PARSED, () => { Elements.video.play(); Elements.overlay.classList.add('hidden'); });
                        } else {
                            Elements.video.src = proxiedUrl; Elements.video.play(); Elements.overlay.classList.add('hidden');
                        }
                        return;
                    }
                    clearTimeout(timeoutId);
                } catch (err) { console.warn("Direct stream fetch timeout/fail. Using iframes."); }

                // SMART FALLBACK: If direct stream fails or times out, use the Multi-Server Switcher
                Player.renderServers();
                Elements.video.classList.add('hidden');
                Elements.iframe.classList.remove('hidden');
                Elements.iframe.src = VideoServers[State.currentServerIdx].url(State.currentAnime.mal_id || State.currentAnime.id, ep.num);
                
                setTimeout(() => { Elements.overlay.classList.add('opacity-0'); setTimeout(() => Elements.overlay.classList.add('hidden'), 300); }, 1500);
            },

            close: () => {
                Elements.modal.classList.add('opacity-0'); Elements.container.classList.add('scale-95');
                setTimeout(() => {
                    Elements.modal.classList.add('hidden');
                    if (State.hls) { State.hls.destroy(); State.hls = null; }
                    Elements.video.pause(); Elements.iframe.src = '';
                }, 300);
            }
        };

        document.getElementById('close-player-btn').onclick = Player.close;
        Elements.video.addEventListener('playing', () => Elements.overlay.classList.add('hidden'));

        // ==========================================
        // 6. CLOUD SYNC (FIREBASE)
        // ==========================================
        const FirebaseOps = {
            init: async () => {
                try {
                    if (typeof __firebase_config === 'undefined') throw new Error();
                    const app = initializeApp(JSON.parse(__firebase_config));
                    State.db = getFirestore(app); State.auth = getAuth(app);
                    await signInAnonymously(State.auth);
                    State.userId = State.auth.currentUser.uid;
                    onSnapshot(collection(State.db, 'artifacts', Config.appId, 'users', State.userId, 'watchlist'), (snap) => {
                        State.watchlist = []; snap.forEach(doc => State.watchlist.push(doc.data())); Renderer.watchlist(); Renderer.grid();
                    });
                } catch (e) { console.warn("Running in local mode."); }
            },
            addToList: async (anime) => {
                if(!State.userId) return UI.toast("Cloud disconnected.", true);
                const docData = { id: anime.mal_id, title: anime.title, image: anime.images?.webp?.large_image_url, episodes: anime.episodes, addedAt: Date.now() };
                try { await setDoc(doc(State.db, 'artifacts', Config.appId, 'users', State.userId, 'watchlist', docData.id.toString()), docData); UI.toast(`Saved ${docData.title}`); }
                catch (e) { UI.toast("Save failed.", true); }
            },
            removeFromList: async (id, title) => {
                if(!State.userId) return;
                try { await deleteDoc(doc(State.db, 'artifacts', Config.appId, 'users', State.userId, 'watchlist', id.toString())); UI.toast(`Removed ${title}`); }
                catch(e){}
            }
        };

        window.addEventListener('DOMContentLoaded', () => { FirebaseOps.init(); API.fetchCatalog(); });
    </script>
</body>
</html>
